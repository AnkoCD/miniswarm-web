[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "miniswarm-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "defusedxml==0.7.1",
  "fastapi==0.139.2",
  "markitdown[all]==0.1.6",
  "matplotlib==3.10.3",
  "openpyxl==3.1.5",
  "pandas==2.3.1",
  "pillow==12.3.0",
  "pdfplumber==0.11.9",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "pytest==8.4.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "reportlab==5.0.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["runner_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
