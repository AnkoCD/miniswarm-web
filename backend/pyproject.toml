[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "miniswarm-backend"
version = "0.1.0"
description = "MiniSwarm Web API and workers"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "celery[redis]==5.6.3",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "psycopg[binary]==3.3.4",
  "PyJWT==2.13.0",
  "pwdlib[argon2]==0.3.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
